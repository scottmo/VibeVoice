[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice"
version = "0.0.1"
authors = [
  { name="vibevoice team", email="vibepod@microsoft.com" },
]
description = "A model for speech generation with an AR + diffusion architecture."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.7.1",
    "accelerate==1.6.0",
    "transformers==4.51.3",
    "diffusers",
    "tqdm",
    "numpy",
    "scipy",
    "huggingface_hub",
    "librosa",
    "soundfile",
    "rotary-embedding-torch",
    "einops",
    "ml-collections",
    "absl-py",
    "gradio>=4.0.0,<6.0.0",
    "av",
    "aiortc",
    "bitsandbytes>=0.48.2",
    "python-dotenv"
]


[project.urls]
"Homepage" = "https://github.com/microsoft/VibeVoice"
"Bug Tracker" = "https://github.com/microsoft/VibeVoice/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibevoice*"]
exclude = ["tests*", "venv*", "models*"]
